name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt
      - name: Run tests
        working-directory: server
        run: python -m pytest -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install scanners
        run: pip install "bandit>=1.7.9" "pip-audit>=2.7"
      - name: Check no secrets file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is committed. Remove it and rotate the keys in it."
            exit 1
          fi
      - name: Static security scan (bandit)
        run: bandit -r server -x server/tests,server/venv,server/.venv
      - name: Dependency vulnerability scan (pip-audit)
        # Resolves the dependency tree without installing it, so PyTorch is not downloaded.
        run: pip-audit -r server/requirements.txt -r server/requirements-dev.txt --progress-spinner off
