<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Scan · BCR</title>
    <link rel="icon" href="bcrlogo-small.png">
    <link rel="apple-touch-icon" href="bcrlogo-small.png">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="upload.html"><img src="bcrlogo-small.png" alt="">BCR</a>
        <nav>
            <a href="upload.html" aria-current="page">Scan</a>
            <a href="results.html">My Cards</a>
            <button type="button" id="logoutBtn" class="link-button">Log out</button>
        </nav>
    </header>
    <main class="page">
        <h1 class="title">Scan Business Card</h1>
        <div id="message" hidden></div>
        <div class="camera-box" id="cameraBox">
            <video id="camera" autoplay playsinline muted></video>
        </div>
        <div class="actions">
            <button type="button" class="btn" id="captureBtn">Capture</button>
            <label class="btn outline" for="photoInput">Take or choose photo</label>
            <input type="file" id="photoInput" class="visually-hidden" accept="image/*">
        </div>
        <img id="outputImage" class="preview" alt="Detected business cards" hidden>
        <button type="button" class="btn green wide" id="confirmBtn" hidden>Confirm and read cards</button>
    </main>
    <script src="js/common.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
