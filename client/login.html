<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Login · BCR</title>
    <link rel="icon" href="bcrlogo-small.png">
    <link rel="apple-touch-icon" href="bcrlogo-small.png">
    <link rel="stylesheet" href="app.css">
</head>
<body class="login-page">
    <form class="login-box" id="login-form" novalidate>
        <img class="logo" src="bcrlogo-small.png" alt="">
        <h1 class="title">Business Card Reader</h1>
        <div id="message" hidden></div>
        <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="username" autocapitalize="none" inputmode="email" required>
        </div>
        <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 8 characters" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn green" id="login-btn">Log in</button>
        <button type="button" class="btn" id="signup-btn">Sign up</button>
    </form>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
