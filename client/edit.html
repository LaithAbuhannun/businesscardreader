<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Card Details</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
        }

        .template {
            width: 90%;
            max-width: 900px;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            animation: change 2s infinite;
        }

        .card-block {
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-block img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .field-group {
            margin: 10px 0;
        }

        .field-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .field-group input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .save-btn, .remove-btn {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .remove-btn {
            background-color: #d93025;
        }

        .card-note {
            color: #8a1c13;
            margin: 10px 0 0;
        }

        #save {
            margin-top: 5px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4c8bf5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        @keyframes change {
            0% { color: red; }
            50% { color: #4c8bf5; }
            100% { color: #34a853; }
        }
    </style>
    <link rel="stylesheet" href="messages.css">
</head>
<body>
    <div class="template">
        <h1>Edit Card Details</h1>
        <div id="message" hidden></div>
        <div id="cards-container"></div>
        <button id="save">Save All</button>
    </div>
    <script src="js/common.js"></script>
    <script src="js/edit.js"></script>
</body>
</html>
