<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>My Cards · BCR</title>
    <link rel="icon" href="bcrlogo-small.png">
    <link rel="apple-touch-icon" href="bcrlogo-small.png">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="upload.html"><img src="bcrlogo-small.png" alt="">BCR</a>
        <nav>
            <a href="upload.html">Scan</a>
            <a href="results.html" aria-current="page">My Cards</a>
            <button type="button" id="logoutBtn" class="link-button">Log out</button>
        </nav>
    </header>
    <main class="page">
        <h1 class="title">My Cards</h1>
        <div id="message" hidden></div>
        <div id="export-bar" class="actions" hidden>
            <button type="button" class="btn" id="export-csv">Download CSV</button>
            <button type="button" class="btn outline" id="export-vcf">Download vCard</button>
        </div>
        <div id="results-container"></div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
