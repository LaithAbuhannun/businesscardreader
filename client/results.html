<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanned Card Results</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
        }

        .template {
            width: 90%;
            max-width: 900px;
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            animation: change 2s infinite;
        }

        .card-block {
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-block img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .field-group {
            margin: 10px 0;
        }

        .field-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .field-group span {
            display: block;
            font-size: 16px;
            color: #444;
        }

        .export-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .export-bar[hidden] {
            display: none;
        }

        .export-bar button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4c8bf5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        @keyframes change {
            0% { color: red; }
            50% { color: #4c8bf5; }
            100% { color: #34a853; }
        }
    </style>
    <link rel="stylesheet" href="messages.css">
</head>
<body>
    <div class="template">
        <h1>Scanned Business Cards</h1>
        <div id="message" hidden></div>
        <div id="export-bar" class="export-bar" hidden>
            <button type="button" id="export-csv">Download CSV</button>
            <button type="button" id="export-vcf">Download vCard</button>
        </div>
        <div id="results-container"></div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
